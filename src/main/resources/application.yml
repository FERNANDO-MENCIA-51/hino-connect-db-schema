    username: neondb_owner
    password: npg_Eo9ldCsZ7AKr

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: hinoconnect2024secretkeysupersecureandlongforproduction
  expiration: 86400000 # 24 horas en milisegundos

logging:
